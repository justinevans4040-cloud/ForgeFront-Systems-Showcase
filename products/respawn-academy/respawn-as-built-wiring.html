<div id="respawn-wiring" role="img" aria-label="Respawn Academy legacy site wiring diagram showing Netlify hosting, static assets, navigation, a simulated demo form, and two external Perplexity app links.">
  <style>
    #respawn-wiring { color: var(--foreground); }
    #respawn-wiring .wire { fill: none; stroke: var(--border); stroke-width: 2; }
    #respawn-wiring .wire-external { fill: none; stroke: var(--viz-series-2); stroke-width: 2; stroke-dasharray: 7 5; }
    #respawn-wiring .wire-warning { fill: none; stroke: var(--destructive); stroke-width: 2; stroke-dasharray: 4 4; }

    #respawn-wiring text { fill: var(--foreground); font-weight: 400; }
    #respawn-wiring .sub { fill: var(--muted-foreground); }
    #respawn-wiring svg { width: 100%; height: auto; display: block; }
    @media (max-width: 520px) { #respawn-wiring .sub { display: none; } }
